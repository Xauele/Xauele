    } try {
        const next = validateImport(JSON.parse(await file.text()));
        if (!next) {
            toast(tr('jsonBad'));
            return;
        }
        if (!confirm(tr('jsonImportAsk')))
            return;
        if (commit(next)) {
            selectedDate = today;
            photo = null;
            nav('dashboard');
            toast(tr('jsonImported'));
        }
    }
    catch {
        toast(tr('jsonBad'));
    } }
    function reset(mode) { if (mode === 'clear-all') {
        if (!confirm(tr('clearAsk')))
            return;
        const next = structuredClone(state);
        next.meals = [];
        next.feedback = [];
        next.samples = false;
        if (commit(next)) {
            selectedDate = today;
            nav('dashboard');
            toast(tr('clearDone'));
        }
    }
    else {
        if (!confirm(tr('resetAsk')))
            return;
        const next = structuredClone(state);
        next.meals = samples();
        next.feedback = [];
        next.samples = true;
        if (commit(next)) {
            selectedDate = today;
            nav('dashboard');
            toast(tr('resetDone'));
        }
    } }
    function shiftDay(diff) { const d = dateFrom(selectedDate); d.setDate(d.getDate() + diff); selectedDate = dateKey(d); renderDashboard(); }
    function action(node) {
        const a = node.dataset.action, mid = node.dataset.id;
        switch (a) {
            case 'prev-day':
                shiftDay(-1);
                break;
            case 'next-day':
                shiftDay(1);
                break;
            case 'camera':
                $('#camera-input')?.click();
                break;
            case 'gallery':
                $('#gallery-input')?.click();
                break;
            case 'manual':
                editMeal();
                break;
            case 'photo-manual':
                editMeal();
                break;
            case 'demo-analyze':
                demoAnalyze();
                break;
            case 'close':
                closeSheet();
                break;
            case 'edit': {
                const m = state.meals.find(x => x.id === mid);
                if (m)
                    editMeal(m);
                break;
            }
            case 'delete': {
                const m = state.meals.find(x => x.id === mid);
                if (!m || !confirm(tr('removeMealAsk')))
                    break;
                const next = structuredClone(state);
                next.meals = next.meals.filter(x => x.id !== mid);
                next.feedback = next.feedback.filter(x => x.mealId !== mid);
                if (commit(next)) {
                    closeSheet();
                    render();
                    toast(tr('deleted'));
                }
                break;
            }
            case 'feedback-ok':
                recordFeedback(mid, 'correct');
                break;
            case 'feedback-no':
                feedbackModal(mid);
                break;
            case 'export-json':
                exportJSON();
                break;
            case 'export-csv':
                exportCSV();
                break;
            case 'import-json':
                $('#import-file')?.click();
                break;
            case 'clear-all':
            case 'reset-demo':
                reset(a);
                break;
        }
    }
    document.addEventListener('click', ev => { const el = ev.target.closest('[data-lang],[data-nav],[data-action],[data-open],[data-food],[data-day]'); if (el?.dataset.lang) {
        setLanguage(el.dataset.lang);
        return;
    } if (el?.dataset.nav) {
        nav(el.dataset.nav);
        return;
    } if (el?.dataset.action) {
        action(el);
        return;
    } if (el?.dataset.open) {
        openDetail(el.dataset.open);
        return;
    } if (el?.dataset.food) {
        const f = FOODS.find(x => x.id === el.dataset.food);
        if (f)
            editMeal(null, f);
        return;
    } if (el?.dataset.day) {
        selectedDate = el.dataset.day;
        nav('dashboard');
        return;
    } if (ev.target.classList.contains('modal-scrim'))
        closeSheet(); });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && overlay.children.length) {
        closeSheet();
        return;
    } if (ev.key === 'Tab' && overlay.children.length) {
        const nodes = $$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])', $('.sheet')).filter(n => n.offsetWidth || n.offsetHeight);
        if (!nodes.length)
            return;
        const idx = nodes.indexOf(document.activeElement);
        if (ev.shiftKey && idx <= 0) {
            ev.preventDefault();
            nodes[nodes.length - 1].focus();
        }
        else if (!ev.shiftKey && idx === nodes.length - 1) {
            ev.preventDefault();
            nodes[0].focus();
        }
    } });
    render();
    Object.defineProperty(window, '__nitroQA', { configurable: true, value: Object.freeze({ snapshot: () => structuredClone(state), summary: day => sum(mealOn(day || today)), locale: () => state.lang, version: () => state.version }) });
})();

</script>
</body>
</html>
