.home-actions{margin-top:-1px;padding:10px 17px 0;position:relative;z-index:3;background:linear-gradient(180deg,#030910,#07121b)}.primary-action{border:1px solid #cbff9f;min-height:57px;width:100%;border-radius:12px;background:linear-gradient(180deg,#a0ff6e,#65ed43 65%,#2baa26);display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:#04200d;font:1000 17px var(--display);letter-spacing:.015em;box-shadow:inset 0 1px #fff8,0 4px 0 #0f5824,0 0 16px #64ff4d55;transition:transform .12s,filter .12s}.primary-action:active{transform:translateY(2px);box-shadow:0 2px 0 #0f5824,0 0 9px #64ff4d44}.primary-action svg{height:23px;width:23px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.action-tile{border:1px solid #204954;background:linear-gradient(145deg,#071c24,#061018);color:#d7f1f4;min-height:66px;border-radius:11px;text-align:left;padding:13px 14px;display:flex;gap:10px;align-items:center;box-shadow:inset 0 1px #2e586755}.action-tile svg{width:27px;height:27px;color:var(--cyan);flex-shrink:0}.action-tile strong{font-size:12px;display:block}.action-tile small{font-size:10px;color:#799fa9;display:block;margin-top:4px}
.macro-triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.macro-meter{border:1px solid #214752;border-radius:10px;background:linear-gradient(148deg,#0c222a,#071019);padding:12px 10px 11px;min-width:0;position:relative;overflow:hidden}.macro-meter:before{content:"";position:absolute;left:0;top:0;width:42px;height:2px;background:var(--tone);box-shadow:0 0 9px var(--tone)}.macro-meter .macro-title{font:800 10px var(--font);color:#a8bfc6}.macro-meter strong{display:block;font:900 22px/1.5 var(--display);letter-spacing:-.04em}.macro-meter strong span{font-size:11px;font-weight:600;color:#97b3b9;letter-spacing:0}.macro-meter .track{height:5px;background:#1b3340;border-radius:10px;margin:7px 0 4px;overflow:hidden}.macro-meter .fill{height:100%;display:block;width:var(--pct);background:var(--tone);box-shadow:0 0 10px var(--tone);border-radius:5px}.macro-meter small{font-size:9px;color:#7897a0}

/* Native-inspired dock */
.bottom-nav{position:sticky;z-index:15;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:stretch;height:calc(74px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:linear-gradient(180deg,#061118f7,#02060cfb);border-top:1px solid #29616b;box-shadow:0 -8px 32px #0009;backdrop-filter:blur(18px)}.bottom-nav:before{content:"";position:absolute;top:-1px;left:38%;right:38%;height:2px;background:var(--cyan);box-shadow:0 0 10px #12e8fe}.nav-item{position:relative;border:0;background:transparent;color:#91b3be;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;font-size:10px;font-weight:700;padding:9px 0 7px}.nav-item.active{color:var(--lime);text-shadow:0 0 14px #71ff6266}.nav-item.active:before{content:"";position:absolute;top:0;left:32%;right:32%;height:2px;background:var(--lime);box-shadow:0 0 11px var(--lime)}.nav-item svg{width:21px;height:21px}.nav-item--scan .scan-halo{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;margin-top:-30px;background:linear-gradient(160deg,#a3ff6a,#56e44a);border:3px solid #04151a;color:#051a12;box-shadow:0 0 0 1px #66ec62,0 0 18px #62ff59a1}.nav-item--scan .scan-halo svg{width:24px;height:24px}.nav-item--scan{justify-content:end;gap:3px}
@media(min-width:520px){body{padding:25px 0 40px}.phone{min-height:780px;border:1px solid #2c5260;border-radius:26px;box-shadow:0 0 0 8px #010509,0 30px 100px #000,0 0 70px #0edcf018}.topbar{border-radius:25px 25px 0 0}.bottom-nav{border-radius:0 0 25px 25px}.view{min-height:650px}}@media(max-width:359px){.brand-word strong{font-size:29px}.topbar{padding-left:12px;padding-right:12px}.brand-symbol{width:34px}.cluster-top{padding-left:13px;padding-right:13px}.dial{width:260px;height:222px}.cluster{min-height:382px}.dial-text__count{font-size:55px}.macro-meter{padding:10px 7px}.macro-meter strong{font-size:19px}.screen-block{padding:0 12px}.food-card img{height:104px}.food-card{min-height:194px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* v2 visual QA adjustments: keep navigation on-screen and bring the food photography above the fold */
.bottom-nav{position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:min(100%,440px);height:calc(76px + var(--safe-bottom));}
.phone .view{padding-bottom:calc(102px + var(--safe-bottom));}
.stage-side{pointer-events:none}
.cluster{min-height:340px}
.cluster-top{padding-top:12px}
.cluster-title{padding-top:10px}
.dial{height:215px;width:260px;margin:-2px auto -3px}
.dial-text{top:7px}
.dial-text__count{font-size:59px}
.dial-peak{height:78px;opacity:.40}
.cluster-footer{padding:0 19px 12px}
.screen-home .screen-block{margin-top:16px}
.screen-home .section-header{margin-bottom:9px}
.screen-home .showcase{min-height:172px}
.screen-home .macro-meter{padding-top:10px;padding-bottom:8px}
.screen-home .home-actions{margin-top:16px;padding-top:0}
.screen-home .action-grid{margin-top:9px}
.screen-home .action-tile{min-height:55px;padding:9px 12px}
@media(max-width:519px){.stage-side{display:none}}
@media(min-width:520px){.bottom-nav{border-radius:0 0 25px 25px;bottom:0}}
@media(max-width:359px){.cluster{min-height:328px}.dial{height:206px;width:246px}.dial-text__count{font-size:53px}}
.showcase{display:block;width:100%;text-align:left;color:var(--ink);padding:0;cursor:pointer}
.showcase:hover{border-color:#65ff78;box-shadow:0 0 21px #50ff5751}
.scan-controls button svg{width:21px;height:21px;flex:none}
.plain-photo svg{height:34px;width:34px}
.meal-pic svg{height:26px;width:26px}
.detail-hero>div svg{height:70px;width:70px;filter:drop-shadow(0 0 19px #69ff52)}
.catalog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.catalog-toolbar .food-count{margin:0}
.manual-shortcut{border:1px solid #4c7f8b;background:#0b2830;color:var(--cyan);padding:8px 10px;border-radius:8px;font:800 10px var(--font);white-space:nowrap}
</style>

  function renderJournal(){const arr=onDay(date),val=totals(arr),goal=state.goal.kcal;$('#view').innerHTML=`<section class="screen"><header class="screen-head"><div class="module-code">LOG / 02</div><h1>${t('journalTitle')} <em>//</em></h1><p>${t('journalSub')}</p></header><div class="journal-bar"><button data-shift="-1" type="button" aria-label="${t('back')}">‹</button><div class="journal-date">${escapeHTML(displayDayFull(date))}<small>${date}</small></div><button data-shift="1" type="button" ${date>=today()?'disabled':''} aria-label="${t('today')}">›</button></div><div class="daily-summary"><div><small>${t('consumed')}</small><b>${fmt(val.kcal)}</b></div><div><small>${t('target')}</small><b>${fmt(goal)}</b></div><div><small>${t('remaining')}</small><b>${fmt(Math.max(0,goal-val.kcal))}</b></div></div><div class="screen-block tight">${heading(t('journalTitle'),`${arr.length} ${t('entries')}`)}</div><div class="day-entry">${arr.length?arr.map(m=>`<div class="day-entry-top" style="margin-bottom:10px">${mealTile(m)}<button type="button" class="delete-btn" data-delete-meal="${escapeHTML(m.id)}" aria-label="${t('delete')}">×</button></div>`).join(''):`<div class="empty-note">${t('emptyDay')}</div>`}</div><section class="screen-block"><button class="flat-btn flat-btn--lime" data-action="add" type="button">+ ${t('addMeal')}</button></section></section>`}

  function openMeal(id){const m=state.meals.find(m=>m.id===id);if(!m)return;if(m.foodId==='manual'){manualModal(m);return}openDetail(m.foodId,{mealId:id,grams:m.grams})}
  function saveDetail(){const f=FOODS[detailId];if(!f)return;if(detailMealId){const m=state.meals.find(m=>m.id===detailMealId);if(m)m.grams=portion;message(t('changed'))}else{state.meals.push({id:uuid(),foodId:f.id,date:date<=today()?date:today(),time:new Date().toTimeString().slice(0,5),grams:portion,source:'user'});message(t('added'))}state.status='user';save();detailMealId=null;sampleResult=false;date=today();setPage('journal')}
  function shiftDay(delta){let d=dayDate(date);d.setDate(d.getDate()+delta);const k=localDay(d);if(k>today())return;date=k;render()}
  function switchLang(lang){if(lang!==state.lang){state.lang=lang;save();$('#toast').classList.remove('visible');clearTimeout(toastTimer);render()}}
  function toggleFav(id){if(!FOODS[id])return;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();renderFoodCards()}
  function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
  function exportJSON(){download('zar-backup.json',JSON.stringify(state,null,2),'application/json;charset=utf-8')}
  async function importFile(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('large');const parsed=JSON.parse(await file.text());state=sanitizeState(parsed);save();setPage('settings');message(t('importOk'))}catch{message(t('invalidFile'))}finally{e.target.value=''}}
  function dialog(title,desc,body='',confirmLabel=t('confirm'),onConfirm=()=>{}){const root=$('#dialog');root.hidden=false;root.innerHTML=`<div class="dialog-card" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><div class="dialog-head"><h2>${escapeHTML(title)}</h2><button type="button" class="dialog-close" data-dialog-close aria-label="${t('cancel')}">×</button></div><p class="dialog-desc">${escapeHTML(desc)}</p>${body}<div class="form-error" id="dialog-error"></div><div class="row-end"><button type="button" data-dialog-close>${t('cancel')}</button><button type="button" class="positive" id="dialog-confirm">${escapeHTML(confirmLabel)}</button></div></div>`;root.querySelectorAll('[data-dialog-close]').forEach(b=>b.addEventListener('click',closeDialog));$('#dialog-confirm').addEventListener('click',onConfirm);$('#dialog-confirm').focus()}
  function closeDialog(){$('#dialog').hidden=true;$('#dialog').replaceChildren()}
  function manualModal(existing=null){const m=existing;const vals=m||{name:'',grams:250,kcal:'',p:0,c:0,f:0};const fields=[['name',t('manualName'),'text',100],['grams',t('manualGram'),'number',6000],['kcal',t('manualKcal'),'number',10000],['p',t('manualProtein'),'number',1000],['c',t('manualCarbs'),'number',1000],['f',t('manualFat'),'number',1000]];const body=`<form id="manual-form"><div class="form-grid" style="grid-template-columns:1fr 1fr">${fields.map(([id,label,type,max])=>`<label class="field" style="${id==='name'?'grid-column:span 2':''}"><span>${escapeHTML(label)}</span><input id="manual-${id}" type="${type}" value="${escapeHTML(vals[id]??'')}" ${type==='number'?`min="${['grams','kcal'].includes(id)?1:0}" max="${max}" step="any"`:`maxlength="${max}"`} required></label>`).join('')}</div></form>`;
    dialog(m?t('edit'):t('quickManual'),t('estimates'),body,m?t('saveEdit'):t('manualSave'),()=>{const name=$('#manual-name').value.trim(),grams=Number($('#manual-grams').value),kcal=Number($('#manual-kcal').value),p=Number($('#manual-p').value),c=Number($('#manual-c').value),f=Number($('#manual-f').value);if(!name||name.length>100||![grams,kcal,p,c,f].every(Number.isFinite)||grams<=0||grams>6000||kcal<=0||kcal>10000||[p,c,f].some(v=>v<0||v>1000)){$('#dialog-error').textContent=t('manualError');return}const meal={id:m?.id||uuid(),foodId:'manual',name,grams,kcal,p,c,f,date:m?.date||date,time:m?.time||new Date().toTimeString().slice(0,5),source:'user'};if(m){const index=state.meals.findIndex(x=>x.id===m.id);if(index>=0)state.meals[index]=meal}else state.meals.push(meal);state.status='user';save();closeDialog();setPage('journal');message(t('added'))})}
  function confirmDelete(id){dialog(t('delete'),t('confirmDelete'),'',t('yesDelete'),()=>{state.meals=state.meals.filter(m=>m.id!==id);state.status='user';save();closeDialog();render();message(t('changed'))})}
  function feedback(kind){if(kind==='correct'){state.feedback.push({kind:'correct',ts:new Date().toISOString()});save();message(t('feedbackSaved'));return}dialog(t('feedbackQuestion'),t('demoNote'),`<div class="settings-card" style="padding:10px"><label class="field"><span>${t('feedbackQuestion')}</span><select id="feedback-kind"><option value="wrongDish">${t('wrongDish')}</option><option value="wrongPortion">${t('wrongPortion')}</option><option value="wrongMacros">${t('wrongMacros')}</option></select></label></div>`,t('feedbackSent'),()=>{state.feedback.push({kind:$('#feedback-kind').value,ts:new Date().toISOString()});save();closeDialog();message(t('feedbackSaved'))})}
  document.addEventListener('click',(e)=>{
    const button=e.target.closest('button');if(!button||button.closest('#dialog'))return;
    const nav=button.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}
    const lang=button.closest('[data-lang]');if(lang){switchLang(lang.dataset.lang);return}
    const next=button.closest('[data-page-open]');if(next){if(next.dataset.pageOpen==='food')foodFilter='all';setPage(next.dataset.pageOpen);return}
    const food=button.closest('[data-food-id]');if(food){openDetail(food.dataset.foodId);return}
    const meal=button.closest('[data-open-meal]');if(meal){openMeal(meal.dataset.openMeal);return}
    const fav=button.closest('[data-favorite]');if(fav){toggleFav(fav.dataset.favorite);return}
    const filter=button.closest('[data-filter]');if(filter){foodFilter=filter.dataset.filter;$$('[data-filter]').forEach(b=>{b.classList.toggle('selected',b===filter);b.setAttribute('aria-pressed',String(b===filter))});renderFoodCards();return}
    const shift=button.closest('[data-shift]');if(shift){shiftDay(Number(shift.dataset.shift));return}
    const del=button.closest('[data-delete-meal]');if(del){confirmDelete(del.dataset.deleteMeal);return}
    const amount=button.closest('[data-portion]');if(amount){portion=Number(amount.dataset.portion);$('#portion-input').value=String(portion);updatePortionUI();return}
    const feed=button.closest('[data-feedback]');if(feed){feedback(feed.dataset.feedback);return}
    const a=button.closest('[data-action]');if(!a)return;
    switch(a.dataset.action){
      case 'add':foodFilter='all';setPage('food');break;
      case 'detail-back':setPage(detailMealId?'journal':'food');break;
      case 'save-detail':saveDetail();break;
      case 'take-photo':$('#camera-file').click();break;
      case 'pick-photo':$('#gallery-file').click();break;
      case 'demo-recognition':openDetail('schabowy',{origin:'demo'});break;
      case 'export':exportJSON();break;
      case 'import':$('#import-file').click();break;
      case 'reset':dialog(t('reset'),t('restoreQuestion'),'',t('confirm'),()=>{const lang=state.lang;state=seed();state.lang=lang;save();closeDialog();date=today();setPage('home');message(t('resetOk'))});break;
      case 'clear':dialog(t('clear'),t('clearQuestion'),'',t('confirm'),()=>{const lang=state.lang,goal=state.goal;state={...seed(),lang,goal,meals:[],favorites:[],feedback:[],status:'user'};save();closeDialog();date=today();setPage('home');message(t('clearOk'))});break;
      case 'manual':manualModal();break;
    }
  });
  document.addEventListener('input',e=>{if(e.target?.id==='portion-input'){portion=safeNumber(e.target.value,50,1000);updatePortionUI()}if(e.target?.id==='food-search'){foodQuery=e.target.value;renderFoodCards()}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').hidden)closeDialog()});
  $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))closeDialog()});
  // Explicitly exposed to local automated tests; no user data leaves the browser.
  Object.defineProperty(window,'__zarTest',{value:Object.freeze({getState:()=>JSON.parse(JSON.stringify(state)),totals:()=>totals(onDay(today())),navigate:setPage,openFood:openDetail}),configurable:false});
  render();
})();
</script></body>
</html>
