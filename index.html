<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Kopytka Nitro. Neonowy, dwujęzyczny dziennik z polskimi daniami i smakowitymi zdjęciami. Wersja demonstracyjna.">
  <title>KOPYTKA // NITRO | Food Edition</title>
  <style>
:root {
  --bg: #060811;
  --surface: #0d1320;
  --surface2: #111b2a;
  --surface3: #182538;
  --text: #f5f9ff;
  --muted: #a5b5cb;
  --muted2: #8194ad;
  --lime: #bbff36;
  --cyan: #28e5ff;
  --pink: #fa42bd;
  --violet: #985bff;
  --orange: #ffab38;
  --red: #ff5878;
  --line: #355069;
  --max: 475px;
  --tech: ui-monospace,"SFMono-Regular",Consolas,monospace;
  --display: Impact,"Arial Narrow","DejaVu Sans Condensed",sans-serif;
  --ui: Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html {
  background: #060811;
}
body {
  margin: 0;
  color: var(--text);
  font: 14px/1.48 var(--ui);
  min-height: 100dvh;
  overflow-x: hidden;
}
button,input,select,textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
}
button:focus-visible,input:focus-visible,select:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}
a {
  color: var(--lime);
}
svg {
  display: block;
}
input,textarea,select {
  accent-color: var(--lime);
}
.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: radial-gradient(ellipse at 5% 100%,#6a165a66,transparent 43%),radial-gradient(ellipse at 100% 3%,#004d6890,transparent 42%),#04050b;
}
.ambient__grid {
  position: absolute;
  bottom: -18%;
  left: -20%;
  right: -20%;
  height: 65%;
  background: repeating-linear-gradient(90deg,transparent 0 52px,#35ccef24 54px),repeating-linear-gradient(0deg,transparent 0 44px,#54eff51c 45px);
  transform: perspective(500px) rotateX(62deg) scale(1.5);
  transform-origin: bottom;
  mask-image: linear-gradient(transparent,#000);
}
.ambient__glow {
  position: absolute;
  inset: 0;
  background: linear-gradient(114deg,transparent 40%,#3a8aff09 42%,transparent 43%),linear-gradient(125deg,transparent 70%,#de4eff16 72%,transparent 73%);
}
.app {
  position: relative;
  min-height: 100dvh;
  max-width: var(--max);
  margin: 0 auto;
  padding-bottom: calc(100px + env(safe-area-inset-bottom));
  background: radial-gradient(ellipse at 75% 22%,#132f4880,transparent 50%),linear-gradient(155deg,#080c18,#0b101b 60%,#0c0c19);
  box-shadow: 0 0 0 1px #57718931,0 30px 160px #000f;
  isolation: isolate;
  overflow: hidden;
}
.app::before {
  content: "";
  position: absolute;
  inset: 67px 0 0;
  background: repeating-linear-gradient(0deg,transparent,transparent 5px,#e5eeff03 6px),linear-gradient(108deg,transparent 80%,#25a2fd0d 82%,transparent 84%);
  pointer-events: none;
  z-index: -1;
}
.masthead {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 13px 16px;
  background: #070b15ee;
  min-height: 75px;
  position: relative;
  z-index: 5;
}
.mark {
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  height: 44px;
  transform: skewX(-9deg);
  border: 1px solid #b7ff3655;
  background: linear-gradient(130deg,#1c2c27,#0a1218);
  box-shadow: 0 0 21px #9aff3427;
  position: relative;
  color: var(--lime);
}
.mark::before {
  content: "";
  position: absolute;
  inset: -4px auto -4px -4px;
  width: 2px;
  background: var(--lime);
  box-shadow: 0 0 13px var(--lime);
}
.mark svg {
  height: 34px;
  width: 34px;
  transform: skewX(9deg);
}
.identity {
  flex: 1;
  min-width: 0;
}
.identity__name {
  font: 900 italic 21px/.95 var(--display);
  letter-spacing: -.035em;
  white-space: nowrap;
}
.identity__name span {
  color: #7187a0;
  padding: 0 3px;
  font-style: normal;
}
.identity__name em {
  font-style: inherit;
  color: var(--lime);
  text-shadow: 0 0 18px #bbff363f;
}
.identity__small {
  font: 700 8px/1.3 var(--tech);
  color: #8da6b8;
  letter-spacing: .035em;
  white-space: nowrap;
  margin-top: 6px;
}
.identity__small i {
  display: inline-block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--lime);
  vertical-align: middle;
  margin: 0 3px;
}
.identity__small b {
  color: var(--lime);
}
.language {
  display: flex;
  align-items: center;
  border: 1px solid #3d5765;
  background: #111c29;
  clip-path: polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  padding: 3px;
  gap: 2px;
}
.language button {
  min-height: 35px;
  min-width: 33px;
  background: transparent;
  border: 0;
  color: #bdccdb;
  font: 900 11px var(--tech);
}
.language .is-active {
  color: #0a0d13;
  background: var(--lime);
  box-shadow: 0 0 12px #c9ff3655;
}
.language>span {
  font: 900 11px var(--tech);
  color: #506174;
}
.signal-line {
  height: 2px;
  background: linear-gradient(90deg,var(--lime) 0 28%,var(--cyan) 52%,transparent 95%);
  box-shadow: 0 0 17px #47efff66;
}
.demo-signal {
  margin: 10px 15px 0;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  background: linear-gradient(90deg,#c5ff351b,#1bffde0b);
  border: 1px solid #a4ef4a54;
  position: relative;
  z-index: 1;
}
.demo-signal strong {
  font: 900 11px var(--tech);
  color: var(--lime);
  letter-spacing: .035em;
}
.demo-signal span {
  font: 700 10px var(--tech);
  color: #bac9d6;
}
.demo-signal .statuslight {
  width: 6px;
  height: 6px;
  background: var(--lime);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--lime);
  flex-shrink: 0;
}
.demo-signal__left {
  display: flex;
  align-items: center;
  gap: 8px;
}
#screen {
  position: relative;
  z-index: 1;
}
.topscene {
  padding: 21px 17px 17px;
  position: relative;
  overflow: hidden;
  min-height: 520px;
  border-bottom: 1px solid #2d516a;
}
.topscene:before {
  content: "";
  position: absolute;
  top: 0;
  right: -40px;
  width: 290px;
  height: 380px;
  pointer-events: none;
  background: radial-gradient(ellipse at 66% 17%,#a22edb41,transparent 68%),linear-gradient(145deg,transparent 45%,#22eafe1c 45.3%,transparent 47%);
  opacity: .9;
}
.topscene:after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 155px;
  pointer-events: none;
  background: linear-gradient(0deg,#2a152f21,transparent 80%),repeating-linear-gradient(110deg,transparent 0 26px,#c4ff3e08 27px 29px);
  mask-image: linear-gradient(transparent,#000);
}
.topscene>* {
  position: relative;
  z-index: 1;
}
.micro {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  align-items: center;
  color: #91b6ca;
  font: 800 10px var(--tech);
  letter-spacing: .075em;
}
.micro .accent {
  color: var(--cyan);
}
.micro .tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.micro .tag:before {
  content: "";
  height: 5px;
  width: 11px;
  background: var(--lime);
  transform: skewX(-25deg);
  box-shadow: 0 0 10px var(--lime);
}
.hero-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 8px;
  margin-top: 17px;
}
.hero-eyebrow {
  color: var(--cyan);
  font: 900 11px var(--tech);
  letter-spacing: .10em;
}
.hero-title {
  margin: 4px 0 8px;
  font: 900 italic clamp(43px,11vw,56px)/.87 var(--display);
  letter-spacing: -.036em;
  text-transform: uppercase;
  transform: skewX(-3deg);
  text-shadow: 0 6px 24px #000b;
}
.hero-title span {
  color: var(--lime);
  text-shadow: 0 0 21px #abff3750;
}
.hero-intro {
  max-width: 248px;
  font: 700 11px var(--tech);
  color: #b0c4cf;
  text-transform: uppercase;
  line-height: 1.5;
}
.day-control {
  display: flex;
  align-items: center;
  gap: 1px;
  min-width: 113px;
  background: #121e2a;
  border: 1px solid #43657a;
  transform: skewX(-7deg);
}
.day-control button {
  min-width: 32px;
  min-height: 39px;
  border: 0;
  background: none;
  color: var(--lime);
  font-size: 24px;
}
.day-control strong {
  font: 900 10px var(--tech);
  color: #c6d8e6;
  text-align: center;
  flex: 1;
  min-width: 45px;
  white-space: nowrap;
}
.meter-zone {
  position: relative;
  display: grid;
  place-items: center;
  height: 275px;
  margin: 5px auto 4px;
  max-width: 355px;
}
.meter-zone:before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 235px;
  height: 235px;
  border-radius: 50%;
  box-shadow: inset 0 0 85px #04070ccf,0 0 75px #54e8ff20;
  background: radial-gradient(circle,#101f2a 12%,#0a111b 51%,#0e151e 71%,transparent 72%);
}
.meter-zone:after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 207px;
  height: 207px;
  border: 1px solid #99d7ff17;
  border-radius: 50%;
}
.meter-svg {
  width: 100%;
  height: 275px;
  filter: drop-shadow(0 0 12px #67faff26);
  z-index: 1;
  overflow: visible;
}
.meter-center {
  position: absolute;
  left: 50%;
  top: 47%;
  transform: translate(-50%,-50%);
  z-index: 2;
  text-align: center;
  white-space: nowrap;
}
.meter-center__label {
  display: block;
  font: 800 10px var(--tech);
  letter-spacing: .15em;
  color: #94b7ca;
}
.meter-center__amount {
  display: block;
  font: 900 italic clamp(64px,17vw,78px)/.98 var(--display);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.052em;
  margin: 8px 0 1px;
}
.meter-center__unit {
  display: block;
  color: var(--lime);
  font: 900 12px var(--tech);
  letter-spacing: .18em;
}
.meter-center__target {
  display: block;
  font: 750 10px var(--tech);
  color: #9db2c1;
  margin-top: 8px;
}
.meter-center__percent {
  display: block;
  font: 900 18px var(--tech);
  color: var(--lime);
  margin-top: 6px;
}
.meter-side {
  position: absolute;
  top: 50%;
  font: 900 10px var(--tech);
  color: #84a0ac;
}
.meter-side--l {
  left: 3px;
  transform: rotate(-90deg);
}
.meter-side--r {
  right: 3px;
  transform: rotate(90deg);
}
.pit-summary {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #50708055;
  padding-top: 12px;
}
.pit-summary__label {
  display: block;
  font: 800 10px var(--tech);
  color: #90aabb;
  letter-spacing: .05em;
}
.pit-summary strong {
  display: block;
  font: 900 italic 30px var(--display);
  color: var(--lime);
}
.pit-summary strong small {
  font: 800 11px var(--tech);
}
.pit-summary .over {
  color: var(--red);
}
.pit-summary__state {
  padding: 9px 12px;
  transform: skewX(-8deg);
  font: 900 10px var(--tech);
  color: var(--lime);
  background: #c8ff3512;
  border: 1px solid #adff3656;
  white-space: nowrap;
}
.pit-summary__state.over {
  color: var(--red);
  background: #ff557814;
  border-color: #ff557866;
}
.page-content {
  padding: 15px 16px 24px;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin: 18px 0 11px;
}
.section-heading h2 {
  margin: 0;
  font: 900 italic 25px/.96 var(--display);
  text-transform: uppercase;
  letter-spacing: -.015em;
}
.section-heading h2:before {
  content: "//";
  color: var(--lime);
  font: 900 16px var(--tech);
  margin-right: 7px;
}
.section-heading .aside {
  color: #89a9be;
  font: 800 10px var(--tech);
  text-transform: uppercase;
}
.ignite {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 94px;
  border: 0;
  text-align: left;
  padding: 15px 15px;
  background: linear-gradient(115deg,#e0ff44,#aaff21 70%,#8bea1b);
  clip-path: polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);
  color: #0a0e18;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px #f0ffabc0;
}
.ignite:after {
  content: "";
  position: absolute;
  inset: -40px -30px auto auto;
  width: 50%;
  height: 200%;
  background: repeating-linear-gradient(110deg,transparent 0 14px,#133f0615 15px 17px);
  transform: rotate(-10deg);
  pointer-events: none;
}
.ignite__icon {
  flex: 0 0 58px;
  height: 58px;
  border: 2px solid #122717;
  display: grid;
  place-items: center;
  position: relative;
}
.ignite__icon svg {
  width: 35px;
}
.ignite__copy {
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  flex: 1;
}
.ignite__copy small {
  font: 900 10px var(--tech);
  letter-spacing: .09em;
}
.ignite__copy strong {
  font: 900 italic 30px/.96 var(--display);
  letter-spacing: -.01em;
}
.ignite__copy em {
  font: 750 10px var(--tech);
  font-style: normal;
  margin-top: 4px;
}
.ignite__arrow {
  font-size: 34px;
  position: relative;
  z-index: 1;
}
.macro-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 9px;
}
.macro-card {
  padding: 14px 10px 12px;
  position: relative;
  background: linear-gradient(155deg,#142032,#0b1220);
  border: 1px solid #39516c;
  clip-path: polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
  min-width: 0;
}
.macro-card:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 45%;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 14px var(--accent);
}
.macro-card:nth-child(1) {
  --accent: var(--cyan);
}
.macro-card:nth-child(2) {
  --accent: var(--pink);
}
.macro-card:nth-child(3) {
  --accent: var(--violet);
}
.macro-card__label {
  display: flex;
  justify-content: space-between;
  gap: 2px;
  color: #b0c5d3;
  font: 900 10px var(--tech);
  text-transform: uppercase;
  white-space: nowrap;
}
.macro-card__letter {
  color: var(--accent);
  font-size: 15px;
  line-height: 1;
}
.macro-card__amount {
  font: 900 29px/.9 var(--display);
  margin: 17px 0 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.macro-card__amount span {
  font: 800 10px var(--tech);
  color: #99acbd;
}
.macro-progress {
  height: 6px;
  background: #293648;
  overflow: hidden;
}
.macro-progress>i {
  height: 100%;
  display: block;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.macro-foot {
  font: 800 10px var(--tech);
  color: #97acbf;
  margin-top: 8px;
}
.meal-row {
  position: relative;
  display: flex;
  gap: 11px;
  align-items: center;
  background: linear-gradient(90deg,#141d2c,#0d1421);
  border: 1px solid #2c4964;
  margin: 7px 0;
  padding: 12px 10px;
  min-height: 70px;
  width: 100%;
  text-align: left;
  color: inherit;
  transition: border-color .2s,background .2s;
}
.meal-row:hover {
  border-color: var(--cyan);
}
.meal-row__icon {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  display: grid;
  place-items: center;
  background: linear-gradient(130deg,#222e3e,#111827);
  border: 1px solid #435b67;
  color: #fff;
  font-size: 23px;
  overflow: hidden;
}
.meal-row__icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.meal-row__info {
  flex: 1;
  min-width: 0;
}
.meal-row__info strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.meal-row__info span {
  color: #a3b5c7;
  font: 700 10px var(--tech);
}
.meal-row__kcal {
  font: 900 22px var(--display);
  color: var(--lime);
  text-align: right;
  white-space: nowrap;
}
.meal-row__kcal small {
  font: 750 9px var(--tech);
  display: block;
  color: #93abba;
}
.meal-row__chev {
  color: var(--cyan);
  font: 900 23px var(--tech);
}
.demo-pill {
  font: 800 9px var(--tech);
  color: var(--pink);
  border: 1px solid #ed51bb5c;
  padding: 2px 5px;
  margin-left: 5px;
  display: inline-block;
}
.empty {
  padding: 24px 19px;
  text-align: center;
  background: #111b2b;
  border: 1px dashed #4b657d;
  color: #c1cddc;
}
.empty strong {
  display: block;
  color: var(--lime);
  font: 900 italic 22px var(--display);
  margin: 7px;
}
.muted {
  color: var(--muted);
}
.smallprint {
  font: 650 11px/1.55 var(--ui);
  color: #9bafc0;
  margin: 16px 0;
}
.subpage-head {
  padding: 28px 17px 21px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(155deg,#0b1725,#10242b 54%,#101625);
  border-bottom: 1px solid #365773;
}
.subpage-head:before {
  content: "";
  position: absolute;
  right: -5%;
  top: -40px;
  width: 160px;
  height: 250px;
  background: linear-gradient(135deg,transparent 34%,#a34ef136 35%,transparent 40%);
  transform: skewX(-10deg);
}
.subpage-head>* {
  position: relative;
}
.subpage-head .tag {
  color: var(--cyan);
  font: 900 11px var(--tech);
  letter-spacing: .12em;
}
.subpage-head h1 {
  font: 900 italic clamp(42px,11vw,54px)/.93 var(--display);
  letter-spacing: -.02em;
  text-transform: uppercase;
  margin: 5px 0 12px;
}
.subpage-head h1 em {
  font-style: inherit;
  color: var(--lime);
}
.subpage-head p {
  max-width: 330px;
  font-size: 12px;
  line-height: 1.55;
  color: #bfd0dd;
  margin: 0;
}
.camera-panel {
  border: 1px solid #375d7d;
  position: relative;
  padding: 12px;
  background: radial-gradient(ellipse at center,#1533497c,#0a1321 65%);
  margin: 15px 0;
  display: grid;
  justify-items: center;
  gap: 14px;
}
.camera-panel:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed #2d799855;
  pointer-events: none;
}
.camera-panel__frame {
  height: 142px;
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  margin-top: 3px;
  overflow: hidden;
}
.camera-panel__frame:after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg,transparent 48%,#4fecfc23 50%,transparent 52%);
  background-size: 100% 18px;
  animation: scanlines 8s linear infinite;
  pointer-events: none;
}
.camera-panel__frame svg {
  height: 108px;
  width: 108px;
  filter: drop-shadow(0 0 20px #37e3ff55);
}
.camera-panel__frame img {
  max-height: 136px;
  max-width: 100%;
  object-fit: contain;
  box-shadow: 0 0 35px #00aaff44;
}
.camera-panel__title {
  font: 900 italic 23px var(--display);
  text-align: center;
  margin: 0;
}
.camera-panel__sub {
  text-align: center;
  margin: 0;
  color: #a7bfd0;
  font-size: 12px;
}
.camera-panel__actions {
  display: flex;
  gap: 8px;
  width: 100%;
}
.btn {
  border: 1px solid #49627a;
  background: linear-gradient(130deg,#152333,#0f1928);
  color: #ecf9ff;
  padding: 12px 14px;
  font: 900 12px var(--tech);
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-transform: uppercase;
  transition: transform .18s,background .18s,border-color .18s;
}
.btn:active {
  transform: translateY(1px);
}
.btn:hover {
  border-color: var(--lime);
}
.btn--lime {
  background: var(--lime);
  border-color: var(--lime);
  color: #0c1218;
}
.btn--outline {
  color: var(--cyan);
  border-color: #3c8798;
  background: #0c1b27;
}
.btn--pink {
  color: #ffd8f0;
  border-color: #ba428d;
  background: #341529;
}
.btn--red {
  color: #ffc3c9;
  border-color: #8d3548;
  background: #2d131e;
}
.btn--full {
  width: 100%;
}
.btn--grow {
  flex: 1;
}
.action-separator {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #89aaba;
  font: 800 10px var(--tech);
  margin: 19px 0 13px;
  letter-spacing: .09em;
}
.action-separator:before,.action-separator:after {
  content: "";
  height: 1px;
  flex: 1;
  background: #3b5268;
}
.search {
  width: 100%;
  height: 48px;
  border: 1px solid #48657c;
  color: #f2faff;
  background: #101927;
  padding: 12px 14px;
  outline: 0;
  font-size: 14px;
}
.search:focus {
  border-color: var(--lime);
}
.food-row {
  width: 100%;
  display: flex;
  gap: 11px;
  align-items: center;
  text-align: left;
  padding: 11px;
  background: #111c2a;
  border: 1px solid #33465e;
  margin-top: 7px;
  color: inherit;
  min-height: 66px;
}
.food-row:hover {
  border-color: var(--lime);
}
.food-row__icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  background: #223147;
  font-size: 24px;
}
.food-row__name {
  flex: 1;
}
.food-row__name strong {
  display: block;
  font-size: 13px;
}
.food-row__name small {
  display: block;
  color: #9db2c4;
  font: 750 10px var(--tech);
}
.food-row__plus {
  font: 900 25px var(--tech);
  color: var(--lime);
}
.telemetry-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.telemetry-card {
  min-height: 105px;
  background: linear-gradient(145deg,#142033,#101724);
  border: 1px solid #3d5068;
  padding: 14px;
  border-radius: 9px 22px 9px 9px;
}
.telemetry-card small {
  font: 750 11px var(--tech);
  display: block;
  color: #a2b7c9;
}
.telemetry-card strong {
  font: 900 italic 39px/1 var(--display);
  display: block;
  margin: 8px 0;
  color: var(--lime);
}
.telemetry-card em {
  display: block;
  font-style: normal;
  color: #b8c9d8;
  font: 750 10px var(--tech);
}
.chart {
  height: 225px;
  padding: 18px 10px 12px;
  background: linear-gradient(160deg,#141d30,#0c1422);
  border: 1px solid #364f65;
  display: flex;
  align-items: flex-end;
  gap: 7px;
}
.chart__column {
  height: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  min-width: 0;
}
.chart__bar {
  display: block;
  width: 100%;
  height: calc(var(--value) * 1%);
  min-height: 2px;
  background: linear-gradient(180deg,var(--lime),#41e6d7);
  box-shadow: 0 0 17px #99ff2647;
  position: relative;
  border-radius: 2px 2px 0 0;
}
.chart__bar:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: #e6ffbc;
}
.chart__bar--zero {
  height: 0;
  min-height: 0;
  background: transparent;
}
.chart__label {
  height: 21px;
  display: grid;
  place-items: center;
  font: 750 10px var(--tech);
  color: #acbed0;
  width: 100%;
  white-space: nowrap;
}
.chart__track {
  width: 100%;
  height: 166px;
  display: flex;
  align-items: end;
  background: linear-gradient(#1a2d40,#0e1826);
  border: 1px solid #344d65;
  padding: 0 2px;
}
.chart__track--today {
  border-color: var(--cyan);
}
.history-day {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 12px 13px;
  margin: 6px 0;
  gap: 10px;
  min-height: 64px;
  background: #111d2a;
  color: #ecf4ff;
  text-align: left;
  border: 1px solid #3b546b;
}
.history-day strong {
  font-size: 13px;
  flex: 1;
}
.history-day small {
  display: block;
  color: #a3bacb;
}
.history-day em {
  font: 900 23px var(--display);
  font-style: italic;
  color: var(--lime);
}
.tuning-box {
  border: 1px solid #39536c;
  background: linear-gradient(160deg,#151e2b,#0c141f);
  padding: 17px;
  margin: 14px 0;
}
.tuning-box h2 {
  margin: 0 0 15px;
  font: 900 italic 23px var(--display);
  text-transform: uppercase;
}
.tuning-box h2 span {
  color: var(--lime);
  font: 850 12px var(--tech);
  vertical-align: middle;
  margin-right: 8px;
}
.field {
  display: grid;
  gap: 6px;
  margin: 10px 0;
}
.field label {
  font: 850 11px var(--tech);
  color: #bfd0db;
  text-transform: uppercase;
}
.field input,.field select,.field textarea {
  border: 1px solid #50677a;
  background: #0d1826;
  color: #edf5fc;
  min-height: 46px;
  padding: 11px 12px;
  width: 100%;
  border-radius: 0;
  outline: none;
}
.field textarea {
  min-height: 80px;
  resize: vertical;
}
.field input:focus,.field select:focus,.field textarea:focus {
  border-color: var(--lime);
}
.field input[type=number] {
  font-variant-numeric: tabular-nums;
}
.field-row {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
}
.field-row .field input {
  padding: 9px 6px;
}
.panel-note {
  padding: 11px;
  border-left: 3px solid var(--cyan);
  background: #0d2633;
  color: #c3d8e5;
  font-size: 12px;
  line-height: 1.6;
}
.warning-note {
  border-left-color: var(--orange);
  background: #302414;
  color: #ffdfae;
}
.setting-actions {
  display: grid;
  gap: 9px;
}
.setting-actions__two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.overline {
  font: 850 10px var(--tech);
  color: #99aabb;
  text-transform: uppercase;
  letter-spacing: .1em;
  margin: 0 0 8px;
}
.legend {
  color: #b1c3d0;
  font-size: 12px;
  line-height: 1.5;
}
.mini-tags {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.mini-tag {
  border: 1px solid #54819b;
  color: var(--cyan);
  padding: 5px 9px;
  font: 850 10px var(--tech);
}
.mini-tag--lime {
  border-color: #a8ec5266;
  color: var(--lime);
}
.dock {
  position: fixed;
  z-index: 20;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: min(100%,var(--max));
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  min-height: calc(80px + env(safe-area-inset-bottom));
  padding: 8px 8px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg,#070a12,#0a1020ed);
  border-top: 1px solid #43677a;
  box-shadow: 0 -18px 45px #000c;
  backdrop-filter: blur(13px);
}
.dock__item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  flex-direction: column;
  min-width: 0;
  border: 0;
  background: transparent;
  color: #8aa2b8;
  font: 900 10px var(--tech);
  letter-spacing: .02em;
}
.dock__item>svg {
  height: 25px;
  width: 25px;
}
.dock__item.active {
  color: var(--lime);
}
.dock__item.active:before {
  content: "";
  position: absolute;
  top: -9px;
  height: 3px;
  width: 70%;
  background: var(--lime);
  box-shadow: 0 0 18px var(--lime);
}
.dock__item--scan .dock__scan-icon {
  height: 46px;
  width: 51px;
  display: grid;
  place-items: center;
  background: var(--lime);
  color: #111a13;
  clip-path: polygon(0 0,75% 0,100% 25%,100% 100%,0 100%);
  box-shadow: 0 0 18px #b9ff3f47;
  margin-top: -17px;
}
.dock__scan-icon svg {
  width: 27px;
  height: 27px;
}
.dock__item--scan.active .dock__scan-icon {
  background: #defe86;
}
.dock__item--scan.active:before {
  display: none;
}
.overlay-root {
  position: fixed;
  z-index: 40;
  inset: 0;
  pointer-events: none;
}
.modal-scrim {
  position: absolute;
  inset: 0;
  pointer-events: auto;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: #000b;
  backdrop-filter: blur(8px);
}
.sheet {
  width: min(100%,var(--max));
  max-height: 94dvh;
  overflow: auto;
  overscroll-behavior: contain;
  background: radial-gradient(ellipse at 100% 0,#213e5155,transparent 45%),#0d1422;
  border: 1px solid #54839b;
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 0 55px #22eaff24,0 -25px 75px #000b;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  animation: sheetin .2s ease;
}
.sheet__head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  background: #101a2b;
  border-bottom: 1px solid #36536c;
  padding: 16px 16px;
}
.sheet__head h2 {
  font: 900 italic 26px var(--display);
  margin: 0;
}
.sheet__body {
  padding: 14px 17px;
}
.sheet__close {
  height: 42px;
  width: 42px;
  border: 1px solid #4b6783;
  background: #1a2b3e;
  color: var(--text);
  font-size: 22px;
}
.sheet__photo {
  display: block;
  max-height: 230px;
  max-width: 100%;
  object-fit: contain;
  margin: 5px auto 13px;
  border: 1px solid #456677;
}
.sheet__foot {
  display: flex;
  gap: 9px;
  margin-top: 13px;
}
.sheet__foot>* {
  flex: 1;
}
.sheet__foot .btn {
  padding: 11px 7px;
}
.detail-macros {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
  margin: 12px 0;
}
.detail-macros .telemetry-card {
  min-height: 82px;
  padding: 11px;
}
.detail-macros .telemetry-card strong {
  font-size: 28px;
}
.feedback-grid {
  display: grid;
  gap: 9px;
  margin: 10px 0;
}
.feedback-grid label {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #142133;
  padding: 10px;
  border: 1px solid #355471;
}
.feedback-grid input {
  height: 20px;
  width: 20px;
  flex: 0 0 20px;
}
.toast-root {
  position: fixed;
  z-index: 100;
  bottom: calc(91px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: min(90vw,440px);
  pointer-events: none;
}
.toast {
  padding: 12px 15px;
  background: #142d29;
  border: 1px solid #8bfa6aaa;
  color: #dcffad;
  font: 800 12px var(--tech);
  text-align: center;
  box-shadow: 0 0 29px #9bff3329;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
.hide {
  display: none !important;
}
@keyframes sheetin {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
@keyframes scanlines {
  to {
    background-position: 0 100%;
  }
}
@media (min-width:520px) {
  .app {
    margin: 20px auto;
    min-height: calc(100dvh - 40px);
    border: 1px solid #3d5a77;
    border-radius: 22px;
    overflow: hidden;
  }
  .masthead {
    border-radius: 22px 22px 0 0;
  }
  .dock {
    border-radius: 0 0 22px 22px;
  }
}
@media (max-width:350px) {
  .identity__name {
    font-size: 18px;
  }
  .identity__edition {
    display: none;
  }
  .identity__small {
    font-size: 9px;
  }
  .mark {
    flex-basis: 37px;
    height: 39px;
  }
  .hero-title {
    font-size: 40px;
  }
  .hero-intro {
    max-width: 205px;
  }
  .day-control {
    min-width: 103px;
  }
  .day-control button {
    min-width: 28px;
  }
  .macro-card {
    padding: 12px 7px;
  }
  .macro-card__amount {
    font-size: 25px;
  }
  .ignite__copy strong {
    font-size: 25px;
  }
  .ignite__icon {
    flex-basis: 49px;
    height: 51px;
  }
  .dock__item {
    font-size: 10px;
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    animation: none !important;
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

.topscene { min-height: 0; padding-top: 17px; }
.topscene:before { pointer-events: none; }
.hero-head { align-items: center; margin: 12px 0 12px; }
.hero-eyebrow { font-size: 9px; }
.hero-title { font-size: clamp(39px,10.6vw,52px); margin: 3px 0 6px; }
.hero-intro { font-size: 10px; }
.meter-zone { height: 235px; max-width: 330px; margin: 4px auto 0; }
.meter-svg { height: 235px; }
.meter-zone:before { width: 208px; height: 208px; }
.meter-zone:after { width: 183px; height: 183px; }
.meter-center { top: 47%; }
.meter-center__label { font-size: 9px; }
.meter-center__amount { font-size: clamp(56px,15vw,69px); margin: 4px 0 0; }
.meter-center__target { margin-top: 4px; }
.meter-center__percent { font-size: 15px; margin-top: 3px; }
.dish-spotlight { display:block; width:100%; height:224px; position:relative; overflow:hidden; text-align:left;
 color:#fff; background:#110e13; border:1px solid #72fba482; padding:0; border-radius:17px 6px 18px 6px;
 box-shadow:0 0 0 1px #37ff9633, 0 20px 32px #0007, 0 0 35px #16f0a320; }
.dish-spotlight img { position:absolute; width:100%; height:100%; inset:0; object-fit:cover; object-position:center 50%; filter:saturate(1.15) contrast(1.06); transition:transform .4s ease; }
.dish-spotlight:hover img { transform:scale(1.06); }
.dish-spotlight:after { content:""; pointer-events:none; position:absolute; inset:0;
 background:linear-gradient(180deg,#031018c9 0%,#01030a00 35%,#040710a9 64%,#02050af5 100%); }
.dish-spotlight:before { content:""; position:absolute;z-index:2;top:0;left:0;width:52%;height:3px;
 background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 0 23px var(--lime); }
.dish-spotlight__top { position:absolute; z-index:3; top:12px;left:12px;right:12px; display:flex;align-items:center;justify-content:space-between;gap:5px; font:900 9px var(--tech);letter-spacing:.065em;color:#e7fff5; }
.dish-spotlight__top>span { display:inline-flex;align-items:center;gap:7px;background:#030f15aa;border:1px solid #2eeccc85;padding:6px 9px;backdrop-filter:blur(7px); }
.hot-dot {width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime); }
.dish-spotlight__top b { color:#bbfeff;font:800 9px var(--tech);padding:6px; }
.dish-spotlight__bottom { display:flex;flex-direction:column;position:absolute;z-index:3;bottom:12px;left:13px;right:13px;gap:5px; }
.dish-spotlight__label { font:900 10px var(--tech);color:var(--lime);text-shadow:0 0 18px #000;letter-spacing:.09em; }
.dish-spotlight__bottom strong { font:900 italic 25px/1.01 var(--display);letter-spacing:-.02em;text-shadow:0 2px 12px #000;max-width:310px; }
.dish-spotlight__foot { display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff; font:900 10px var(--tech); }
.dish-spotlight__foot i,.food-tile__meta i { font-style:normal;color:var(--cyan);margin:0 2px; }
.spotlight-cta {color:#d9ff99;font-size:9px;max-width:52%;text-align:right; }
.pit-summary {margin-top:2px;}
.menu-banner { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:15px 12px;margin-bottom:10px;
 border:1px solid #426983; background:linear-gradient(120deg,#193141,#0d1724);box-shadow:inset 0 2px #2bfcff52; font:850 10px var(--tech);color:var(--cyan); }
.menu-banner strong { font:900 italic 13px var(--display);color:#f6ffef; }
.menu-banner__dot { width:8px;height:8px;background:var(--lime);box-shadow:0 0 12px var(--lime);border-radius:1px;transform:rotate(45deg); }
.food-filters {display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:11px 0 5px;}
.food-filter {flex:0 0 auto;background:#142032;border:1px solid #335571;color:#c7dce6;font:800 11px var(--tech);padding:9px 11px;letter-spacing:.01em;border-radius:6px;}
.food-filter.selected {background:var(--lime);border-color:var(--lime);color:#090d13;box-shadow:0 0 18px #bcff363c;}
.food-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:9px 0 14px; }
.food-tile { position:relative; width:100%;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;
 background:linear-gradient(160deg,#18283a,#101723);border:1px solid #41647b; color:#fff;
 border-radius:15px 5px 15px 5px; box-shadow:0 9px 20px #0007; transition:transform .16s,border-color .16s,box-shadow .16s; }
.food-tile:hover { transform:translateY(-2px);border-color:var(--lime);box-shadow:0 0 22px #bcff3630; }
.food-tile:active { transform:scale(.98); }
.food-tile__photo {width:100%;height:126px;position:relative;display:block;overflow:hidden;background:#142131;}
.food-tile__photo:after {content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#05091380);pointer-events:none;}
.food-tile__photo img {display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.12) contrast(1.08);}
.food-tile__number {position:absolute;left:8px;top:8px;background:#081015ce;backdrop-filter:blur(8px);color:#abffed;padding:4px 6px;font:900 10px var(--tech);}
.food-tile__add {position:absolute;right:8px;bottom:6px;z-index:1;display:grid;place-items:center;width:28px;height:28px;
 border:1px solid var(--lime);background:#baff27;color:#10171c;box-shadow:0 0 12px #a5ff39aa;font:900 20px var(--tech);border-radius:6px;}
.food-tile__text {min-height:87px;padding:10px 11px 12px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;}
.food-tile__text strong {font:800 13px/1.2 var(--ui);letter-spacing:-.015em;}
.food-tile__meta {display:block;font:800 10px var(--tech);color:#acc4d1;}
.food-tile__meta em {font-style:normal;color:var(--lime);}
.food-list {margin-top:12px;}
.meal-row {border-radius:12px 3px 12px 3px;min-height:81px;padding:8px 9px; }
.meal-row__icon {width:65px;height:62px;flex-basis:65px;border-radius:9px 2px 9px 2px;background:#1e2730;}
.meal-row__icon img {filter:saturate(1.08);}
.meal-row__info strong {font-size:13px;white-space:normal;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sheet__photo {width:100%;max-height:245px;object-fit:cover;border-radius:14px 4px 14px 4px;border:1px solid #388e99;box-shadow:0 0 22px #3aeefa22;}
@media (max-width:350px){
  .dish-spotlight {height:205px;}
  .dish-spotlight__bottom strong {font-size:22px;}
  .food-tile__photo {height:108px;}
  .food-tile__text strong {font-size:12px;}
  .food-grid {gap:8px;}
  .food-tile__text {padding:9px;min-height:88px;}
  .hero-title {font-size:37px;}
  .dish-spotlight__top b {display:none;}
}

</style>
  
</head>

                if (changed.length) {
                    next.feedback = next.feedback.filter(f => f.mealId !== item.id);
                    next.feedback.push({ mealId: item.id, status: 'incorrect', fields: changed, note: '', at: new Date().toISOString() });
                }
            }
            if (!commit(next))
                return;
            photo = null;
            closeSheet();
            selectedDate = item.day;
            nav('dashboard');
            toast(tr(existing ? 'updated' : 'saved'));
            if (ai) {
                setTimeout(() => openDetail(item.id), 100);
            }
        });
    }
    function openDetail(mid) { const m = state.meals.find(x => x.id === mid); if (!m)
        return; const f = state.feedback.find(x => x.mealId === mid); const stats = [['protein', m.p], ['carbs', m.c], ['fat', m.f]].map(([k, v]) => `<div class="telemetry-card"><small>${tr(k)}</small><strong>${fmt(v)}</strong><em>g</em></div>`).join(''); showSheet(getMealName(m), `${m.photo || foodImage(m.foodId) ? `<img class="sheet__photo" src="${esc(m.photo || foodImage(m.foodId))}" alt="${esc(getMealName(m))}">` : ''}<div class="telemetry-head"><div class="telemetry-card"><small>KCAL</small><strong>${fmt(m.kcal)}</strong></div><div class="telemetry-card"><small>${tr('portion')}</small><strong>${fmt(m.grams)}</strong><em>g</em></div></div><div class="detail-macros">${stats}</div><p class="smallprint">${esc(tr(normalizeCategory(m.category)))} · ${esc(longDate(m.day))}${m.demo ? ' · DEMO' : ''}</p>${m.aiOriginal ? `<div class="panel-note warning-note"><strong>${tr('aiResult')}: ${esc(m.aiOriginal.name)}</strong><p>${tr('demoModal')}</p></div><p class="legend" style="margin-top:13px">${tr('feedbackPrompt')} ${f ? `(${tr(f.status === 'correct' ? 'correct' : 'corrected')})` : ''}</p><div class="setting-actions__two"><button class="btn btn--lime" data-action="feedback-ok" data-id="${esc(mid)}">${tr('feedbackYes')}</button><button class="btn btn--pink" data-action="feedback-no" data-id="${esc(mid)}">${tr('feedbackNo')}</button></div>` : ''}<div class="sheet__foot"><button class="btn" data-action="edit" data-id="${esc(mid)}">${tr('edit')}</button><button class="btn btn--red" data-action="delete" data-id="${esc(mid)}">${tr('delete')}</button></div>`); }
    function feedbackModal(mid) { const m = state.meals.find(x => x.id === mid); if (!m)
        return; showSheet(tr('feedbackQuestion'), `<p class="legend">${tr('feedbackInfo')}</p><form id="feedback-form"><div class="feedback-grid">${[['name', 'feedbackName'], ['ingredients', 'feedbackIngredients'], ['grams', 'feedbackPortion'], ['kcal', 'feedbackCal'], ['macros', 'feedbackMacros']].map(([code, title]) => `<label><input type="checkbox" name="field" value="${code}">${tr(title)}</label>`).join('')}</div><div class="field"><label for="feedback-note">${tr('feedbackNote')}</label><textarea id="feedback-note" maxlength="300" placeholder="${tr('feedbackPlaceholder')}"></textarea></div><button class="btn btn--lime btn--full" type="submit">${tr('feedbackSave')}</button></form>`); $('#feedback-form').addEventListener('submit', e => { e.preventDefault(); const fields = $$('input[name=field]:checked').map(x => x.value), note = $('#feedback-note').value.trim(); if (!fields.length && !note) {
        toast(tr('feedbackNeed'));
        return;
    } recordFeedback(mid, 'incorrect', fields, note); }); }
    function recordFeedback(mid, status, fields = [], note = '') { const next = structuredClone(state); next.feedback = next.feedback.filter(f => f.mealId !== mid); next.feedback.push({ mealId: mid, status, fields, note, at: new Date().toISOString() }); if (commit(next)) {
        openDetail(mid);
        toast(tr('feedbackSaved'));
    } }
    function saveGoals(ev) { ev.preventDefault(); const f = new FormData(ev.target), next = structuredClone(state); next.goals = { calories: safe(f.get('calories'), 500, 10000), p: safe(f.get('p'), 0, 1000), c: safe(f.get('c'), 0, 1000), f: safe(f.get('f'), 0, 1000) }; if (!commit(next))
        return; renderTune(); toast(tr('savedGoals')); }
    function setLanguage(lang) { if (!['pl', 'en'].includes(lang) || lang === state.lang)
        return; const next = structuredClone(state); next.lang = lang; if (!commit(next))
        return; closeSheet(); toaster.innerHTML = ''; render(); }
    async function selectedPhoto(file) { if (!file)
        return; if (!file.type.startsWith('image/')) {
        toast(tr('fileType'));
        return;
    } if (file.size > 10 * 1024 * 1024) {
        toast(tr('fileTooBig'));
        return;
    } try {
        const url = URL.createObjectURL(file);
        const src = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(new Error('decode')); i.src = url; });
        const scale = Math.min(1, 960 / Math.max(src.width, src.height)), canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.floor(src.width * scale));
        canvas.height = Math.max(1, Math.floor(src.height * scale));
        canvas.getContext('2d').drawImage(src, 0, 0, canvas.width, canvas.height);
        photo = canvas.toDataURL('image/jpeg', .68);
        URL.revokeObjectURL(url);
        renderScan();
        toast(tr('photoReady'));
    }
    catch {
        toast(tr('photoReadError'));
    } }
    function demoAnalyze() { if (!photo) {
        toast(tr('choosePhoto'));
        return;
    } const ai = { name: state.lang === 'pl' ? 'Schabowy z ziemniakami' : 'Pork schnitzel with potatoes', grams: 430, kcal: 770, p: 43.9, c: 64.9, f: 37 }; editMeal({ ...ai, id: null, category: 'lunch', photo, day: selectedDate }, null, ai); toast(tr('demoResult')); }
    function doDownload(name, contents, type) { const a = document.createElement('a'), blob = new Blob([contents], { type }), url = URL.createObjectURL(blob); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000); }
    function exportJSON() { doDownload('kopytka-nitro-backup.json', JSON.stringify(state, null, 2), 'application/json'); toast(tr('jsonSaved')); }
    function exportCSV() { const cols = ['day', 'name', 'category', 'grams', 'kcal', 'p', 'c', 'f', 'source']; const csv = [cols.join(';'), ...state.meals.map(m => cols.map(k => { let value = k === 'source' ? (m.aiOriginal ? tr('sourceDemo') : m.demo ? 'DEMO' : tr('sourceManual')) : k === 'name' ? getMealName(m) : k === 'category' ? tr(m.category) : m[k] ?? ''; value = String(value); if (/^[=+@\-\t\r]/.test(value))
            value = "'" + value; return '"' + value.replace(/"/g, '""') + '"'; }).join(';'))].join('\r\n'); doDownload('kopytka-nitro-meals.csv', '\ufeff' + csv, 'text/csv;charset=utf-8'); toast(tr('csvSaved')); }
    async function importJSON(file) { if (!file)
        return; if (file.size > 8 * 1024 * 1024) {
        toast(tr('jsonBad'));
        return;
    } try {
        const next = validateImport(JSON.parse(await file.text()));
        if (!next) {
            toast(tr('jsonBad'));
            return;
        }
        if (!confirm(tr('jsonImportAsk')))
            return;
        if (commit(next)) {
            selectedDate = today;
            photo = null;
            nav('dashboard');
            toast(tr('jsonImported'));
        }
    }
    catch {
        toast(tr('jsonBad'));
    } }
    function reset(mode) { if (mode === 'clear-all') {
        if (!confirm(tr('clearAsk')))
            return;
        const next = structuredClone(state);
        next.meals = [];
        next.feedback = [];
        next.samples = false;
        if (commit(next)) {
            selectedDate = today;
            nav('dashboard');
            toast(tr('clearDone'));
        }
    }
    else {
        if (!confirm(tr('resetAsk')))
            return;
        const next = structuredClone(state);
        next.meals = samples();
        next.feedback = [];
        next.samples = true;
        if (commit(next)) {
            selectedDate = today;
            nav('dashboard');
            toast(tr('resetDone'));
        }
    } }
    function shiftDay(diff) { const d = dateFrom(selectedDate); d.setDate(d.getDate() + diff); selectedDate = dateKey(d); renderDashboard(); }
    function action(node) {
        const a = node.dataset.action, mid = node.dataset.id;
        switch (a) {
            case 'prev-day':
                shiftDay(-1);
                break;
            case 'next-day':
                shiftDay(1);
                break;
            case 'camera':
                $('#camera-input')?.click();
                break;
            case 'gallery':
                $('#gallery-input')?.click();
                break;
            case 'manual':
                editMeal();
                break;
            case 'photo-manual':
                editMeal();
                break;
            case 'demo-analyze':
                demoAnalyze();
                break;
            case 'close':
                closeSheet();
                break;
            case 'edit': {
                const m = state.meals.find(x => x.id === mid);
                if (m)
                    editMeal(m);
                break;
            }
            case 'delete': {
                const m = state.meals.find(x => x.id === mid);
                if (!m || !confirm(tr('removeMealAsk')))
                    break;
                const next = structuredClone(state);
                next.meals = next.meals.filter(x => x.id !== mid);
                next.feedback = next.feedback.filter(x => x.mealId !== mid);
                if (commit(next)) {
                    closeSheet();
                    render();
                    toast(tr('deleted'));
                }
                break;
            }
            case 'feedback-ok':
                recordFeedback(mid, 'correct');
                break;
            case 'feedback-no':
                feedbackModal(mid);
                break;
            case 'export-json':
                exportJSON();
                break;
            case 'export-csv':
                exportCSV();
                break;
            case 'import-json':
                $('#import-file')?.click();
                break;
            case 'clear-all':
            case 'reset-demo':
                reset(a);
                break;
        }
    }
    document.addEventListener('click', ev => { const el = ev.target.closest('[data-lang],[data-nav],[data-action],[data-open],[data-food],[data-day]'); if (el?.dataset.lang) {
        setLanguage(el.dataset.lang);
        return;
    } if (el?.dataset.nav) {
        nav(el.dataset.nav);
        return;
    } if (el?.dataset.action) {
        action(el);
        return;
    } if (el?.dataset.open) {
        openDetail(el.dataset.open);
        return;
    } if (el?.dataset.food) {
        const f = FOODS.find(x => x.id === el.dataset.food);
        if (f)
            editMeal(null, f);
        return;
    } if (el?.dataset.day) {
        selectedDate = el.dataset.day;
        nav('dashboard');
        return;
    } if (ev.target.classList.contains('modal-scrim'))
        closeSheet(); });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && overlay.children.length) {
        closeSheet();
        return;
    } if (ev.key === 'Tab' && overlay.children.length) {
        const nodes = $$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])', $('.sheet')).filter(n => n.offsetWidth || n.offsetHeight);
        if (!nodes.length)
            return;
        const idx = nodes.indexOf(document.activeElement);
        if (ev.shiftKey && idx <= 0) {
            ev.preventDefault();
            nodes[nodes.length - 1].focus();
        }
        else if (!ev.shiftKey && idx === nodes.length - 1) {
            ev.preventDefault();
            nodes[0].focus();
        }
    } });
    render();
    Object.defineProperty(window, '__nitroQA', { configurable: true, value: Object.freeze({ snapshot: () => structuredClone(state), summary: day => sum(mealOn(day || today)), locale: () => state.lang, version: () => state.version }) });
})();

</script>
</body>
</html>
